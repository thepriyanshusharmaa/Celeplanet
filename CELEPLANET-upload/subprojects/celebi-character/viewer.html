<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CELEPLANET / Celebi model</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#182a26;color:#eef6e7;font:14px system-ui}header{position:absolute;top:24px;left:28px;z-index:2}h1{font-size:20px;font-weight:500}button{color:inherit;background:#ffffff12;border:1px solid #ffffff30;border-radius:8px;padding:8px 14px;cursor:pointer}#status{color:#a6beaa}canvas{display:block}</style></head><body><header><h1>CELEPLANET / Celebi</h1><p>Drag to orbit · Scroll to zoom</p><button data-view="front">Front</button> <button data-view="side">Side</button> <button data-view="back">Back</button> <button id="spin">Auto rotate</button><p id="status">Loading textured model…</p></header><script src="/landing-pages/inner-green-assets/three.min.js"></script><script src="/celebi/loader.js"></script><script>
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(0,1,5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf1ffed,0x395b49,.85));const key=new THREE.DirectionalLight(0xfff7df,1.1);key.position.set(-3,5,5);scene.add(key);
const controls=new CelebiAssets.OrbitControls(camera,renderer.domElement);controls.target.set(0,.65,0);controls.enableDamping=true;controls.autoRotateSpeed=1.3;controls.update();let rig,time=0;let animate=true;
CelebiAssets.loadCelebi().then(r=>{rig=r;scene.add(rig.model);window.__rig=r;document.getElementById('status').textContent='Textured skinned mesh · Orbit to inspect every angle';}).catch(e=>{document.getElementById('status').textContent=e.message;console.error(e)});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const p={front:[0,1,5],side:[5,1,0],back:[0,1,-5]}[b.dataset.view];camera.position.set(...p);controls.update();});document.getElementById('spin').onclick=()=>controls.autoRotate=!controls.autoRotate;
let prev=performance.now();function tick(now){requestAnimationFrame(tick);time+=Math.min((now-prev)/1000,.05);prev=now;if(rig)CelebiAssets.animateRig(rig,time);controls.update();renderer.render(scene,camera)}requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
